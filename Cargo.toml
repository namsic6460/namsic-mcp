[package]
name = "namsic-mcp"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
roxmltree = "0.21.2"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"
fs4 = { version = "1.1.0", features = ["sync"] }
dunce = "1"
dashmap = "6"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

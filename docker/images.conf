# Docker image build configuration
# Format: IMAGE_TAG  NODE_VERSION  [JAVA_VERSION]  [JDK_DIST]  [DOCKERFILE]
#
# NODE_VERSION : Node.js version for base image (required, use - for base)
# JAVA_VERSION : JDK major version (optional, use - to skip)
# JDK_DIST     : temurin (default), corretto, graalvm (use - to skip)
# DOCKERFILE   : Dockerfile path relative to this directory (default: Dockerfile)
#
# Map built image names in application.yml:
#   app.github.repos:
#     - org: myorg
#       repo: java-project
#       docker-image: "llm-runner:node22-corretto21"
#
# Examples:

llm-runner:base                 -     -     -           base.Dockerfile

llm-runner:node22-graalvm25     22    25    graalvm
llm-runner:node22-corretto21    22    21    corretto
llm-runner:node22-corretto17    22    17    corretto
llm-runner:node22               22
llm-runner:terraform            22    -     -           terraform.Dockerfile
